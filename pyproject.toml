[tool.poetry]
name = "random_movie"
version = "0.1.0"
description = "Let the great random decide for you which movie to watch tonight."
authors = ["Kuragin Vanya <curagin.vanya@yandex.ru>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.120.0"
uvicorn = { extras = ["standard"], version = "^0.34.3" }
sqlalchemy = "^2.0.43"
asyncpg = "^0.30.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.1"
jinja2 = "^3.1.6"
aiofiles = "^25.1.0"
python-multipart = "^0.0.20"
httpx = "^0.27.0"
itsdangerous = "^2.2.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^7.0.0"
ruff = "^0.14.14"
loguru = "^0.7.3"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
