[tool.poetry]
name = "random_movie"
version = "0.1.0"
description = "Let the great random decide for you which movie to watch tonight."
authors = ["Kuragin Vanya <curagin.vanya@yandex.ru>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.13"
uvicorn = { extras = ["standard"], version = "^0.34.3" }
sqlalchemy = "^2.0.41"
asyncpg = "^0.30.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.1"
jinja2 = "^3.1.6"
aiofiles = "^24.1.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0"
ruff = "^0.4.2"
black = "^25.9.0"
loguru = "^0.7.3"
itsdangerous = "^2.2.0"

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I"]
fixable = ["E", "F", "I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
