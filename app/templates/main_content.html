{% if film %}
<div class="card mx-auto" style="max-width: 600px;">
  {% if film.poster_url %}
    <img src="{{ film.poster_url }}" class="card-img-top" alt="Постер фильма" />
  {% endif %}
  <div class="card-body">
    <h3 class="card-title">{{ film.title }} ({{ film.year }})</h3>
    <p class="card-text">Рейтинг: {{ film.rating }}</p>
    <p class="card-text">{{ film.overview }}</p>
  </div>
</div>
{% else %}
<p class="text-center">А может и найден.</p>
{% endif %}

<div class="text-center mt-4">
<form method="get" action="/">
  <button type="submit" class="btn btn-primary btn-lg">Крутануть</button>
</form>
</div>
